<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>世界史タイムライン | 中日对照 · 历史因果时间线</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(145deg, #f7efe3 0%, #ece0d0 100%);
            font-family: 'Segoe UI', 'Roboto', 'Noto Sans', 'Poppins', '微软雅黑', sans-serif;
            padding: 2rem 1rem;
            color: #2c2e24;
        }

        .timeline-book {
            max-width: 1300px;
            margin: 0 auto;
            background: rgba(255, 252, 245, 0.96);
            border-radius: 48px;
            box-shadow: 0 25px 45px -12px rgba(0, 0, 0, 0.2);
            overflow: hidden;
            padding: 2rem 2rem 3rem;
        }

        .hero {
            text-align: center;
            margin-bottom: 2rem;
        }
        .hero h1 {
            font-size: 2.5rem;
            background: linear-gradient(130deg, #4f6d3c, #c17b4c);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            letter-spacing: -0.5px;
        }
        .hero-sub {
            background: #f2e3d2;
            display: inline-block;
            padding: 0.3rem 1.6rem;
            border-radius: 60px;
            color: #7b4a2a;
            font-weight: 500;
            margin-top: 0.5rem;
        }
        .hero-desc {
            max-width: 750px;
            margin: 1rem auto;
            background: #fef3e9;
            padding: 0.5rem 1rem;
            border-radius: 40px;
            font-size: 0.9rem;
        }

        .toolbar {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 2rem;
            flex-wrap: wrap;
            gap: 1rem;
        }
        .download-btn {
            background: #2c6e2c;
            border: none;
            padding: 0.7rem 1.9rem;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 40px;
            color: white;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            transition: 0.2s;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        .download-btn:hover {
            background: #1f541f;
            transform: scale(0.98);
        }
        .print-note {
            font-size: 0.7rem;
            color: #b48b5a;
            align-self: center;
        }

        .era-section {
            margin-bottom: 2.5rem;
            border-radius: 32px;
            background: #ffffffde;
            box-shadow: 0 8px 20px rgba(0,0,0,0.05);
            overflow: hidden;
        }
        .era-header {
            padding: 0.8rem 1.8rem;
            font-size: 1.6rem;
            font-weight: 800;
            background: #fcf6ed;
            border-left: 12px solid;
            display: flex;
            align-items: baseline;
            gap: 1rem;
            flex-wrap: wrap;
        }
        .era-title {
            color: #4a3724;
        }
        .era-date {
            font-size: 0.8rem;
            background: #e9dccc;
            padding: 0.2rem 0.9rem;
            border-radius: 30px;
            font-weight: normal;
        }

        .timeline-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
            gap: 1.5rem;
            padding: 1.5rem;
        }

        .event-card {
            background: white;
            border-radius: 28px;
            box-shadow: 0 6px 14px rgba(0, 0, 0, 0.05);
            transition: 0.2s;
            border: 1px solid #eedfcb;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .event-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 22px rgba(83, 55, 28, 0.12);
        }
        .card-year {
            background: #fcecdb;
            padding: 0.7rem 1rem;
            font-weight: 800;
            font-size: 1.1rem;
            color: #b45f2b;
            border-bottom: 2px solid #ffddb0;
            display: flex;
            flex-wrap: wrap;
            align-items: baseline;
            gap: 8px;
        }
        .year-num {
            background: #e2c7a5;
            padding: 0.1rem 0.5rem;
            border-radius: 40px;
            font-size: 0.9rem;
        }
        .event-title-cn {
            font-weight: 700;
        }
        .event-title-jp {
            font-size: 0.8rem;
            color: #9b6a3c;
            font-weight: normal;
            background: #f9efdf;
            padding: 0.1rem 0.6rem;
            border-radius: 30px;
        }
        .explain-box {
            background: #fff6eb;
            margin: 0.2rem 1rem 0.5rem 1rem;
            padding: 0.6rem 0.8rem;
            border-radius: 20px;
            font-size: 0.85rem;
            border-left: 4px solid #e7b874;
            color: #6a492c;
        }
        .why-box {
            background: #f0f3e8;
            margin: 0.2rem 1rem 0.5rem 1rem;
            padding: 0.6rem 0.8rem;
            border-radius: 20px;
            font-size: 0.85rem;
            border-left: 4px solid #7c9a5e;
            color: #3a5530;
        }
        .relation-box {
            margin: 0.2rem 1rem 0.8rem 1rem;
            padding: 0.5rem 0.8rem;
            background: #f2efe3;
            border-radius: 18px;
            font-size: 0.8rem;
            color: #5b5c3c;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: baseline;
        }
        .relation-label {
            font-weight: 700;
            background: #d9cbae;
            padding: 0.1rem 0.5rem;
            border-radius: 20px;
            font-size: 0.7rem;
        }
        .card-tags {
            padding: 0.4rem 1rem 1rem;
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }
        .tag {
            background: #f0e4d4;
            font-size: 0.7rem;
            padding: 0.2rem 0.7rem;
            border-radius: 30px;
            color: #7c562f;
        }

        /* 时代配色 */
        .era-section[data-era="medieval"] .era-header { border-left-color: #b46f3a; }
        .era-section[data-era="reformation"] .era-header { border-left-color: #7c5e3a; }
        .era-section[data-era="industrial"] .era-header { border-left-color: #5f8b4a; }
        .era-section[data-era="napoleon"] .era-header { border-left-color: #c0894b; }
        .era-section[data-era="imperial"] .era-header { border-left-color: #b37b3c; }
        .era-section[data-era="ww1"] .era-header { border-left-color: #9e5e2e; }
        .era-section[data-era="interwar"] .era-header { border-left-color: #aa6f42; }
        .era-section[data-era="ww2"] .era-header { border-left-color: #a7401a; }
        .era-section[data-era="coldwar"] .era-header { border-left-color: #4e6b3c; }
        .era-section[data-era="modern"] .era-header { border-left-color: #ac8e62; }

        @media (max-width: 780px) {
            .timeline-book { padding: 1rem; }
            .timeline-grid { grid-template-columns: 1fr; gap: 1rem; }
            .era-header { font-size: 1.3rem; }
        }

        @media print {
            body { background: white; padding: 0.1in; }
            .timeline-book { background: white; box-shadow: none; padding: 0; }
            .toolbar, .download-btn, .print-note, .hero-desc { display: none; }
            .event-card { break-inside: avoid; border: 1px solid #aaa; }
            .explain-box, .why-box, .relation-box { background: #f9f9f9; break-inside: avoid; }
        }

        footer {
            text-align: center;
            margin-top: 2rem;
            font-size: 0.7rem;
            color: #b28b64;
            border-top: 1px solid #e7d9cc;
            padding-top: 1.5rem;
        }
    </style>
</head>

        imperial:    { name: "🌏 民族统一·帝国主义", dateRange: "1850-1899", colorKey: "imperial" },

        coldwar:     { name: "❄️ 冷战·独立浪潮", dateRange: "1946-1991", colorKey: "coldwar" },
        modern:      { name: "📱 全球化与新世纪", dateRange: "1992～", colorKey: "modern" }
    };

    function renderTimeline() {
        const container = document.getElementById('timelineContainer');
        if (!container) return;
        container.innerHTML = '';
        
        const grouped = {};
        for (let ev of timelineEvents) {
            if (!grouped[ev.eraId]) grouped[ev.eraId] = [];
            grouped[ev.eraId].push(ev);
        }
        
        for (let eraId of Object.keys(eraMap)) {
            const list = grouped[eraId];
            if (!list || list.length === 0) continue;
            const era = eraMap[eraId];
            const section = document.createElement('div');
            section.className = `era-section`;
            section.setAttribute('data-era', era.colorKey);
            
            const header = document.createElement('div');
            header.className = 'era-header';
            header.innerHTML = `<span class="era-title">${era.name}</span><span class="era-date">${era.dateRange}</span>`;
            section.appendChild(header);
            
            const grid = document.createElement('div');
            grid.className = 'timeline-grid';
            list.sort((a,b) => a.year - b.year);
            for (let ev of list) {
                const card = document.createElement('div');
                card.className = 'event-card';
                const yearDiv = document.createElement('div');
                yearDiv.className = 'card-year';
                yearDiv.innerHTML = `<span class="year-num">${ev.year}</span>
                                     <span class="event-title-cn">${ev.cnTitle}</span>
                                     <span class="event-title-jp">${ev.jpTitle}</span>`;
                const memoryDiv = document.createElement('div');
                memoryDiv.className = 'explain-box';
                memoryDiv.innerHTML = `💡 轻松记：${ev.memory}`;
                const whyDiv = document.createElement('div');
                whyDiv.className = 'why-box';
                whyDiv.innerHTML = `❓ why：${ev.why}`;
                const relationDiv = document.createElement('div');
                relationDiv.className = 'relation-box';
                relationDiv.innerHTML = `<span class="relation-label">🔗 关联</span> ${ev.relation}`;
                const tagsDiv = document.createElement('div');
                tagsDiv.className = 'card-tags';
                for (let tag of ev.tags) {
                    const span = document.createElement('span');
                    span.className = 'tag';
                    span.innerText = tag;
                    tagsDiv.appendChild(span);
                }
                card.appendChild(yearDiv);
                card.appendChild(memoryDiv);
                card.appendChild(whyDiv);
                card.appendChild(relationDiv);
                card.appendChild(tagsDiv);
                grid.appendChild(card);
            }
            section.appendChild(grid);
            container.appendChild(section);
        }
    }
    
    renderTimeline();
